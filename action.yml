name: 'NinjaRift Clan Snapshot'
description: 'Generate and deploy clan reputation snapshots for NinjaRift'
inputs:
  clan-id:
    description: 'NinjaRift clan ID (e.g., 2527)'
    required: true
  accent-color:
    description: 'Accent hex color (e.g., #999999)'
    required: false
  accent-light:
    description: 'Light accent hex color for gradients (e.g., #ff6b8a)'
    required: false
runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: pip install openpyxl
      shell: bash
    - name: Run snapshot
      run: python "${{ github.action_path }}/run.py" --clan-id ${{ inputs.clan-id }} --accent-color "${{ inputs.accent-color }}" --accent-light "${{ inputs.accent-light }}"
      shell: bash
      env:
        GITHUB_REPOSITORY: ${{ github.repository }}
    - name: Commit and push
      shell: bash
      run: |
        git config user.name "clan-snapshot-bot"
        git config user.email "bot@clan-snapshot.local"
        git add -A
        git commit -m "auto: snapshot $(date -u '+%Y-%m-%d %H:%M:%S')" --allow-empty
        git push
    - name: Schedule next run
      shell: bash
      run: |
        NOW_EPOCH=$(date -u +%s)
        TODAY=$(date -u +%Y-%m-%d)
        TARGET_EPOCH=$(date -u -d "$TODAY 05:00:00" +%s)
        [ "$NOW_EPOCH" -gt "$TARGET_EPOCH" ] && TARGET_EPOCH=$((TARGET_EPOCH + 86400))
        SLEEP_SEC=$((TARGET_EPOCH - NOW_EPOCH))
        [ "$SLEEP_SEC" -le 0 ] || [ "$SLEEP_SEC" -gt 1800 ] && SLEEP_SEC=1800
        echo "Sleeping $SLEEP_SEC s until target"
        sleep "$SLEEP_SEC"
        gh workflow run "Clan Snapshot" --repo ${{ github.repository }}
      env:
        GH_TOKEN: ${{ github.token }}
