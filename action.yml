name: 'NinjaRift Clan Snapshot'
description: 'Generate and deploy clan reputation snapshots for NinjaRift'
inputs:
  clan-id:
    description: 'NinjaRift clan ID (e.g., 2527)'
    required: true
  accent-color:
    description: 'Accent hex color (e.g., #999999)'
    required: false
    default: '#999999'
  accent-light:
    description: 'Light accent hex color for gradients (e.g., #ff6b8a)'
    required: false
    default: '#ff6b8a'
runs:
  using: 'composite'
  steps:
    - name: Install dependencies
      run: pip install openpyxl
      shell: bash
    - name: Run snapshot
      run: python "${{ github.action_path }}/run.py" --clan-id ${{ inputs.clan-id }} --accent-color "${{ inputs.accent-color }}" --accent-light "${{ inputs.accent-light }}"
      shell: bash
      env:
        GITHUB_REPOSITORY: ${{ github.repository }}
