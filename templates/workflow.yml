name: Clan Snapshot
on: [workflow_dispatch]
permissions:
  contents: write
  actions: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: nixervo/clan-snapshot-action{{ACTION_REF}}
        with:
          clan-id: {{CLAN_ID}}
